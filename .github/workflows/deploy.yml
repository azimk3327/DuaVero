name: Automated Multi-Branch CI/CD Pipeline

on:
  push:
    branches:
      - 'azim_uat'
      - 'azim_main'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD & TEST JOB
  # =========================================================================
  build-and-test:
    name: Build & Test (Spring Boot 3 + Angular 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Backend: Spring Boot 3 with Java 17
      # ---------------------------------------------------------------------
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        working-directory: ./duavero-backend
        run: |
          mvn clean test -B

      # ---------------------------------------------------------------------
      # Frontend: Angular 17 with Node 20
      # ---------------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./duavero-frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: ./duavero-frontend
        run: |
          npm ci
          npm run build -- --configuration=production

  # =========================================================================
  # 2. DEPLOY JOB (Runs after Build & Test passes)
  # =========================================================================
  deploy:
    name: Deploy to Remote Server via SSH
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref_name == 'azim_uat' || github.ref_name == 'azim_main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Deployment Environment & Target Directory
        id: env_config
        run: |
          if [ "${{ github.ref_name }}" = "azim_uat" ]; then
            echo "DEPLOY_DIR=/home/ubuntu/duavero-uat" >> $GITHUB_OUTPUT
            echo "DOMAIN=duavero-uat.duckdns.org" >> $GITHUB_OUTPUT
            echo "ENV_NAME=UAT" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "azim_main" ]; then
            echo "DEPLOY_DIR=/home/ubuntu/duavero-prod" >> $GITHUB_OUTPUT
            echo "DOMAIN=duavero-app.duckdns.org" >> $GITHUB_OUTPUT
            echo "ENV_NAME=PRODUCTION" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ steps.env_config.outputs.DEPLOY_DIR }}"
            DOMAIN_NAME="${{ steps.env_config.outputs.DOMAIN }}"
            BRANCH_NAME="${{ github.ref_name }}"

            echo "========================================================="
            echo "Deploying branch: $BRANCH_NAME to $DEPLOY_PATH"
            echo "Domain mapping: $DOMAIN_NAME"
            echo "========================================================="

            # Ensure deployment target directory exists
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Pull latest changes or clone if not already a repository
            if [ -d .git ]; then
              echo "Fetching latest changes..."
              git fetch origin "$BRANCH_NAME"
              git checkout "$BRANCH_NAME"
              git reset --hard "origin/$BRANCH_NAME"
            else
              echo "Cloning repository..."
              git clone -b "$BRANCH_NAME" https://github.com/${{ github.repository }}.git .
            fi

            # Deploy and rebuild containers
            echo "Building and starting Docker containers..."
            docker compose up -d --build --remove-orphans

            # Verify container status
            echo "Deployment verification:"
            docker compose ps
