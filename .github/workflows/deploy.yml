name: DuaVero CI/CD Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'azim_main'
      - 'azim_uat'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod

jobs:
  # =========================================================================
  # 1. BUILD & TEST SUITE
  # =========================================================================
  test:
    name: Build & Test (Java 17 & Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Backend Build & Test (Spring Boot 3 + Maven)
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        working-directory: ./duavero-backend
        run: |
          mvn clean test -B

      # Frontend Build & Typecheck (Angular 18 + Node 20)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./duavero-frontend/package-lock.json

      - name: Verify Frontend Production Build
        working-directory: ./duavero-frontend
        run: |
          npm ci
          npm run build -- --configuration=production

  # =========================================================================
  # 2. DOCKER BUILD & PUSH TO DOCKER HUB
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      env_tag: ${{ steps.env_config.outputs.ENV_TAG }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Determine environment: develop/azim_uat -> uat, main/azim_main -> prod
      - name: Determine Target Environment & Tags
        id: env_config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "azim_main" ]; then
            TAG="prod"
          else
            TAG="uat"
          fi
          echo "ENV_TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Environment Tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and Push Backend Container Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./duavero-backend
          file: ./duavero-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ steps.env_config.outputs.ENV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Frontend Container Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./duavero-frontend
          file: ./duavero-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.env_config.outputs.ENV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. REMOTE DEPLOYMENT TO ORACLE VM VIA SSH
  # =========================================================================
  deploy:
    name: Deploy to Oracle VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment on Remote Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 140.245.219.162
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV_NAME="${{ needs.build-and-push-docker.outputs.env_tag || needs.build-and-push.outputs.env_tag }}"
            echo "========================================================="
            echo "Deploying DuaVero to environment: $ENV_NAME"
            echo "Host path: ~/app/$ENV_NAME"
            echo "========================================================="

            mkdir -p ~/app/$ENV_NAME
            cd ~/app/$ENV_NAME

            export DOCKER_USER=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Deployment completed successfully for $ENV_NAME."
