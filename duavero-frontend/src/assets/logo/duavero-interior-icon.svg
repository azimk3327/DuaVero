<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#charcoalGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#subtleGlow)" />

  <!-- Elegant Architectural Sofa Silhouette -->
  <!-- Sofa Backrest -->
  <path d="M 24 46 C 24 38, 30 34, 38 34 L 62 34 C 70 34, 76 38, 76 46 L 76 56 C 76 56, 76 58, 74 58 L 26 58 C 24 58, 24 56, 24 56 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Back Cushion Vertical Pleats -->
  <line x1="38" y1="36" x2="38" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="50" y1="36" x2="50" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="62" y1="36" x2="62" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Left Armrest -->
  <rect x="20" y="44" width="8" height="20" rx="4" fill="url(#goldGrad)" />

  <!-- Right Armrest -->
  <rect x="72" y="44" width="8" height="20" rx="4" fill="url(#goldGrad)" />

  <!-- Seat Cushion -->
  <rect x="26" y="54" width="48" height="11" rx="4" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Tapered Brass Legs -->
  <line x1="26" y1="65" x2="23" y2="74" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="74" y1="65" x2="77" y2="74" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="65" x2="42" y2="74" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="65" x2="58" y2="74" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
