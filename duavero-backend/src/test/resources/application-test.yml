spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:duavero_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

duavero:
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-testing
      expiration-minutes: 15
      refresh-expiration-days: 7
    crypto:
      master-key: test-aes-256-gcm-master-encryption-key-32b

logging:
  level:
    root: INFO
    com.duavero: DEBUG
