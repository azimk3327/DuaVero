version: '3.8'

services:
  # MySQL 8.0 Database (Shared Database with tenant_id Discriminator)
  mysql:
    image: mysql:8.0.36
    container_name: duavero-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-duavero_dev}
      MYSQL_USER: ${DB_USERNAME:-duavero_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-duavero_secure_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=1
      --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      --log-error-suppression-list=MY-013360
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "--default-auth=caching_sha2_password", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redis 7.2 Cache & Distributed Lock (ShedLock)
  redis:
    image: redis:7.2-alpine
    container_name: duavero-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
